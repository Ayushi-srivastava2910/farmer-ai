{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">

<head>
<meta charset="UTF-8">

<!-- ✅ MOBILE FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% trans "Result" %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7f6;">

<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- ✅ RESPONSIVE COLUMN -->
        <div class="col-12 col-md-6">

            <!-- ✅ CARD -->
            <div class="card shadow p-4 text-center">

                <h2 class="text-success">🌱 {% trans "Disease Detected" %}</h2>

                <!-- ✅ DISPLAY CLEAN -->
                <h3 id="disease" class="mt-3">{{ result|cut:"_" }}</h3>

                <p><b>Confidence:</b> {{ confidence|floatformat:2 }}</p>
                <p id="solution" class="mt-3">
                    <b>{% trans "Solution" %}:</b> {{ solution }}
                </p>
                <!-- 🌦 WARNING -->
                <p class="text-danger fw-bold mt-2">{{ warning }}</p>

                <!-- ✅ FORM -->
                <form method="POST" action="{% url 'generate_report' %}">
                    {% csrf_token %}

                    <!-- ✅ KEEP ORIGINAL VALUE -->
                    <input type="hidden" name="disease" value="{{ result }}">
                    <input type="hidden" name="solution" value="{{ solution }}">

                    <button type="submit" class="btn btn-success btn-lg w-100 mt-3">
                        {% trans "Generate Report" %}
                    </button>
                </form>

                <!-- ✅ BUTTON -->
                <div class="mt-3">
                    <a href="/reports/" class="btn btn-primary w-100">
                        {% trans "View All Reports" %}
                    </a>
                </div>

                <button onclick="speakText()" class="btn btn-warning mt-3 w-100">
                    {% if request.LANGUAGE_CODE == "hi" %}
                        🔊 सुनो रिपोर्ट
                    {% else %}
                        🔊 Listen Report
                    {% endif %}
                </button>

                <script>
                function speakText() {

                    let disease = document.getElementById("disease").innerText;
                    let solution = document.getElementById("solution").innerText;

                    let lang = "{{ request.LANGUAGE_CODE }}";

                    let text = "";
                    let text = document.getElementById("disease").innerText + ". " +
                               document.getElementById("solution").innerText;

                    let speech = new SpeechSynthesisUtterance(text);

                    // 🔥 FIX: wait for voices to load
                    let voices = speechSynthesis.getVoices();

                    if (lang === "hi") {
                        speech.lang = "hi-IN";
                    } else {
                        speech.lang = "en-US";
                    }

                    speech.volume = 1;
                    speech.rate = 0.9;
                    speech.pitch = 1;

                    // 🔥 IMPORTANT FIX
                     speechSynthesis.cancel();   // clear previous
                    speechSynthesis.speak(speech);
                }
                </script>

            </div>

        </div>
    </div>
</div>

</body>
</html>
